<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d11;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* 警告ダイアログ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: #1a1a24;
            border: 1px solid #ff4444;
            border-radius: 12px;
            padding: 30px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
        }
        .modal h2 {
            color: #ff4444;
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 25px;
        }
        .btn-agree {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-agree:hover {
            background: #ff2222;
            transform: scale(1.05);
        }

        /* メインコンテンツ */
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p.desc {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .btn-trigger {
            background: #222230;
            border: 2px solid #444466;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }
        .btn-trigger:hover {
            border-color: #ff4444;
            color: #ff4444;
            box-shadow: 0 0 15px rgba(ff, 68, 68, 0.3);
        }
        .test-audio-btn {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .test-audio-btn:hover {
            color: #fff;
            border-color: #888;
        }

        /* ジャンプスケア画面 */
        #jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        #jumpscare-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(150%) brightness(120%);
        }

        /* フラッシュ・振動アニメーション */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 10px) rotate(-2deg); }
            40% { transform: translate(10px, -10px) rotate(2deg); }
            60% { transform: translate(-10px, -10px) rotate(-1deg); }
            80% { transform: translate(10px, 10px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        @keyframes flash {
            0%, 100% { filter: invert(0%) contrast(150%); }
            50% { filter: invert(100%) contrast(200%); }
        }
        .jumpscare-active {
            animation: shake 0.05s infinite, flash 0.1s infinite;
        }
    </style>
</head>
<body>

    <!-- 注意事項モーダル -->
    <div class="modal-overlay" id="warningModal">
        <div class="modal">
            <h2>あと三回押したらなにか起こるかも</h2>
            <p>音出るんだけど小さいから音量上げとくとおもろいよ</p>
            <button class="btn-agree" id="btnAgree">それでも気になる</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container">
        <h1>あと二回だよ</h1>
        <p class="desc">さぁなにがあるんだろうね</p>
        <div class="controls">
            <button class="btn-trigger" id="btnTrigger">次に進む</button>
        </div>
    </div>

    <!-- ジャンプスケア全画面表示 -->
    <div id="jumpscare-overlay">
        <!-- SVGで不気味な顔を生成（外部画像不要） -->
        <img id="jumpscare-img" src="手.jpg" alt="jumpscare">
    </div>

    <script>

        // 高音質な「バン！」という爆発衝撃音のプリロード
        const bangAudio = new Audio('bang.mp3');
        bangAudio.preload = 'auto';
        bangAudio.volume = 1.0; // 最大音量

        // 音声再生関数（事前ロードした実音を即時再生）
        function playScreamSound() {
            try {
                bangAudio.currentTime = 0; // 頭出し
                const playPromise = bangAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Audio play failed:", error);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }
        
function closeJumpscare() {
            // フルスクリーンを解除して新しいページへ移動
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            window.location.href = 'end.html';
        }

        // DOM要素の取得
        const warningModal = document.getElementById('warningModal');
        const btnAgree = document.getElementById('btnAgree');
        const btnTrigger = document.getElementById('btnTrigger');
        const btnTestAudio = document.getElementById('btnTestAudio');
        const jumpscareOverlay = document.getElementById('jumpscare-overlay');
        const jumpscareImg = document.getElementById('jumpscare-img');

        // 注意事項の同意ボタン
        btnAgree.addEventListener('click', () => {
            initAudio();
            warningModal.style.display = 'none';
        });

       // 画像を事前に読み込んでおく（遅延防止）
        const preloadImage = new Image();
        if (jumpscareImg && jumpscareImg.src) {
            preloadImage.src = jumpscareImg.src;
        }

        // 1. ページ読み込み完了時に画像をバックグラウンドで強制的に事前読み込み
        window.addEventListener('DOMContentLoaded', () => {
            if (jumpscareImg && jumpscareImg.src) {
                const img = new Image();
                img.src = jumpscareImg.src;
            }
        });

        // 2. ジャンプスケア発動（音と画像を完全同時に実行）
        btnTrigger.addEventListener('click', () => {
            // 音声コンテキストの再開確認と即時再生
            playScreamSound();

            // 画像オーバーレイを最前面に表示（描画遅延をゼロに）
            jumpscareOverlay.style.display = 'flex';
            requestAnimationFrame(() => {
                jumpscareImg.classList.add('jumpscare-active');
            });

            // 全画面化（可能なら）
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // 2秒後に自動で移動
            setTimeout(() => {
                closeJumpscare();
            }, 2000);
        });


        // 画面クリックでも閉じる
        jumpscareOverlay.addEventListener('click', () => {
            closeJumpscare();
        });

       function closeJumpscare() {
            // フルスクリーンを解除して新しいページへ移動
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            window.location.href = 'end.html';
        }
    </script>
</body>
</html>
